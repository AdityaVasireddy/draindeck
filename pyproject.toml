[project]
name = "draindeck"
version = "0.1.0"
description = "Autonomous issue-resolution runtime - durability foundation"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "pydantic>=2"]

[project.optional-dependencies]
# ADR-26 (docs/08 SS5h): FastAPI/Uvicorn are an explicit framework carve-out
# for the draindeck_dashboard package only. Core src/runtime stays
# framework-free and must never import from this extra.
dashboard = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
draindeck = "runtime.main:main"
draindeck-dashboard = "draindeck_dashboard.cli:main"
draindeck-intake = "draindeck_intake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/intake"]
