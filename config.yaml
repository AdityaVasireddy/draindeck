# v1 reference config (doc 08 §6). Copy to config.yaml and fill in the
# StockAgent validation command. ⚠ Confirm directory name on disk:
# decision says "StockAgent", path says "StockPhotoAgent".
project:
  name: StockAgent
  repository: 'C:\Projects\StockPhotoAgent'
  branch: agent-work
  issues_file: Issues.md
  validation:
    commands:                      # ADR-23 rule 1: absolute interpreter, not
      - "C:\\Python314\\python.exe -m pytest tests\\test_qc_rules.py tests\\test_csv_generator.py tests\\test_metadata_normalize.py tests\\test_validate_batch.py tests\\test_qc_engine.py"
                                    # bare `python`. C:\Python314 has
                                    # StockPhotoAgent's requirements.txt
                                    # installed (pillow==12.2.0 confirmed);
                                    # no project-local venv exists.
                                    # ADR-23 rule 2: explicit file targets,
                                    # not a bare dir/glob relying on discovery
                                    # (pytest.ini's testpaths=tests is a
                                    # default root, not a pin — a future
                                    # conftest.py or new test file would be
                                    # silently swept in). VERIFIED 2026-07-25:
                                    # this exact backslash string, run via
                                    # subprocess.run(cmd, shell=True) from
                                    # C:\Python314\python.exe (mirroring
                                    # Validator._run_once) with cwd=
                                    # StockPhotoAgent, returncode 0, 26 tests
                                    # collected. Step-3 precondition #1 CLOSED.
    timeout_seconds: 600
engine:
  provider: claude-headless
  auth_mode: subscription        # ADR-18; api_key requires ANTHROPIC_API_KEY
  model: default
  max_turns: 30
  timeout_seconds: 1800
  child_env:                     # ADR-22 B layer (belt-and-braces beside the
    HISTORIAN_SWEEP_ACTIVE: '1'  # argv --setting-sources ""); sunset only when
                                 # BOTH Probe A (control, reproduces contamination
                                 # w/o A-empty) and Probe B (A-empty, clean) are
                                 # discriminating green on the same CLI version —
                                 # a green B against a broken/non-reproducing A
                                 # does not satisfy this (doc 08 §5c)
reviewer:
  provider: qwen                 # ADR-05: qwen | claude
  qwen:
    endpoint: 'http://localhost:11434'
    model: qwen2.5-coder:14b     # VERIFIED present at this endpoint
                                 # (localhost:11434/api/tags: 14.8B, Q4_K_M,
                                 # pulled 2026-04-17) — Step-3 precondition #2
                                 # CLOSED. See docs/12 correction note: the
                                 # earlier revert checked the wrong Ollama
                                 # instance (native CLI `ollama list`, not the
                                 # Docker instance actually serving this
                                 # endpoint); knowingly reinstated, not a
                                 # silent re-revert.
budget:                          # ADR-09
  max_attempts_per_issue: 3
  max_executions_per_run: 10
  proxy_pricing: api_list_rates
  hard_stop_proxy_cost_per_run_usd: 15.0
experiment:                      # ADR-19 — do not edit after run begins
  sample_size: 20
  attempt1_success_min: 0.30
  cost_per_shipped_issue_max_usd: 3.0
billing:                         # checklist A1 record
  posture: pro_subscription_headless
  headless_split_status: paused
  verified_on: '2026-07-16'
  reverify_at: phase-2-gate
event_log:
  path: state/events.jsonl
attempts:
  ref_namespace: refs/attempts