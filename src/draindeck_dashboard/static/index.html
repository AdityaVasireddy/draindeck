<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draindeck Dashboard</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/assets/styles/shell.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <link rel="stylesheet" href="/assets/styles/pages.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <noscript>
    <p class="no-js-notice">Draindeck Dashboard requires JavaScript to display registered
      repositories, runs, issues, executions, and evidence.</p>
  </noscript>

  <div class="app-shell">
    <nav id="app-rail" class="app-rail on-dark-surface" aria-label="Primary">
      <div class="app-rail-brand">Draindeck</div>
      <ul id="rail-nav-list" class="app-rail-nav" aria-label="Primary destinations"></ul>
      <button id="rail-expand-toggle" type="button" class="app-rail-expand-toggle"
              aria-pressed="false">Expand</button>
    </nav>

    <div class="app-workspace">
      <header class="app-utility-bar">
        <div class="app-search" role="search">
          <label for="global-search-input" class="visually-hidden">
            Search repositories, issues, runs, executions, evidence
          </label>
          <input id="global-search-input" type="search" name="q" placeholder="Search…"
                 autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="global-search-listbox">
          <ul id="global-search-listbox" class="search-listbox" role="listbox"
              aria-label="Search results" hidden></ul>
        </div>
        <div class="app-utility-actions">
          <p id="connection-status" role="status" aria-live="polite" class="text-label">
            Connecting…
          </p>
          <button id="theme-toggle" type="button" class="theme-toggle">Theme: System</button>
        </div>
      </header>

      <nav class="app-breadcrumbs" aria-label="Breadcrumb">
        <ol id="breadcrumb-list"></ol>
      </nav>

      <main id="main-content" tabindex="-1">
        <div id="page-root">
          <p class="skeleton">Loading…</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
